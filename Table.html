<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Records Table</title>
    <style>
        /* Container styling to center the table */
        .table-container {
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        /* Base table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 16px;
            text-align: left;
        }

        /* Header row styling */
        th {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 12px;
            font-weight: bold;
            border: 1px solid #ffffff;
        }

        /* General cell styling */
        td {
            padding: 12px;
            border: 1px solid #dddddd;
        }

        /* Column 1: Names */
        td:nth-child(1) {
            background-color: #e8f4f8;
            font-style: italic;
            color: #2c3e50;
        }

        /* Column 2: Department */
        td:nth-child(2) {
            background-color: #fcf3cf;
            font-style: italic;
            color: #7d6608;
        }

        /* Column 3: Performance Score */
        td:nth-child(3) {
            background-color: #e8f8f5;
            font-style: italic;
            color: #0e6251;
        }

        /* Row hover effect for better readability */
        tr:hover td {
            filter: brightness(0.95);
        }
    </style>
</head>
<body>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Performance Score</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>John Doe</td><td>Engineering</td><td>92%</td></tr>
                <tr><td>Jane Smith</td><td>Marketing</td><td>88%</td></tr>
                <tr><td>Alex Jones</td><td>Sales</td><td>95%</td></tr>
                <tr><td>Emily Brown</td><td>Finance</td><td>79%</td></tr>
                <tr><td>Michael Clark</td><td>Human Resources</td><td>84%</td></tr>
                <tr><td>Sarah Davis</td><td>Operations</td><td>91%</td></tr>
                <tr><td>David Wilson</td><td>Logistics</td><td>73%</td></tr>
                <tr><td>Emma Martinez</td><td>Legal</td><td>89%</td></tr>
                <tr><td>James Taylor</td><td>IT</td><td>96%</td></tr>
                <tr><td>Olivia Thomas</td><td>Design</td><td>85%</td></tr>
            </tbody>
        </table>
    </div>

</body>
</html>
